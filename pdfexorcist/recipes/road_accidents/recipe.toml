# pdfexorcist recipe: MoRTH Road Accidents in India 2022, Annexures 2-4
#
# Road accidents, persons killed and persons injured by State/UT, 2019 to 2022, with
# each State's share, rate per lakh population, per 10,000 vehicles and per 10,000 km
# of road (MoRTH, 2023). The tables are printed sideways on portrait pages;
# pdfexorcist turns those pages upright before the engines read them. morth.py places
# each value under its numbered column, so the blank cells of Ladakh and Daman & Diu
# shift nothing. Try it:
#
#   pdfexorcist extract https://morth.nic.in/sites/default/files/RA_2022_30_Oct.pdf --recipe pdfexorcist/recipes/road_accidents/recipe.toml
#
# On the fixture (pages 136-138 of the report):
#
#   pdfexorcist extract tests/fixtures/road_accidents/morth_ra_2022_annexure_p136-138.pdf --recipe pdfexorcist/recipes/road_accidents/recipe.toml

name = "MoRTH Road Accidents in India 2022"
description = "Accidents, persons killed and injured by State/UT, 2019-2022, Annexures 2-4"
sample = "../../../tests/fixtures/road_accidents/morth_ra_2022_annexure_p136-138.pdf"

[pages]
match = 'Road Accidents in India:\s*2019\s*to\s*2022'
# Each page also carries its neighbour's table, drawn outside the page box.
fit_boxes = false

[engines]
ocr = false  # a text layer: the five default engines, 3 must agree

[normalize]
remove_commas = true  # Indian grouping: 1,58,984

[parser]
type = "custom"
function = "morth.py:parse"
key = ["table", "state", "column"]

# The States/UTs add up to the Total, in each year.
[[checks]]
column = "state"
rule = "total = rest"
by = ["table", "column"]
where = "column in ['2019', '2020', '2021', '2022']"
name = "States/UTs add up to the Total"

[[checks]]
function = "morth.py:share"

[[checks]]
function = "morth.py:rank"

[output]
layout = "table"
rows = ["measure", "name"]
columns = "column"
format = "csv"
