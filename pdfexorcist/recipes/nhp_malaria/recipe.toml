# pdfexorcist recipe: CBHI National Health Profile, Table 3.1.1
# (State/UT wise cases and deaths due to malaria)
#
# One row per State/UT under an India row, then Cases and Deaths for each of
# five years; the last year is marked provisional. nhp_malaria.py names each
# row's State (one name wraps onto a second line) and each value's year and
# measure. Dadra & Nagar Haveli and Daman & Diu are printed apart for the
# first two years only. Try it on the whole report:
#
#   pdfexorcist extract https://cbhidghs.mohfw.gov.in/sites/default/files/2024-09/Final-Central-Bureau-of-Health-Intelligene-July-2024.pdf --recipe pdfexorcist/recipes/nhp_malaria/recipe.toml
#
# On the fixture (page 120 of the NHP 2023 PDF, printed page 98):
#
#   pdfexorcist extract tests/fixtures/nhp/nhp_2023_p120.pdf --recipe pdfexorcist/recipes/nhp_malaria/recipe.toml

name = "NHP malaria cases and deaths"
description = "State/UT wise malaria cases and deaths by year (CBHI National Health Profile, Table 3.1.1)"
sample = "../../../tests/fixtures/nhp/nhp_2023_p120.pdf"

[pages]
# skips the contents page, which repeats the title
match = 'Deaths due to Malaria in India.{0,300}Cases\s+Deaths'

[engines]
ocr = false

[parser]
type = "custom"
function = "nhp_malaria.py:parse"
key = ["page", "state", "col"]

# the States and UTs add up to India, in each year and measure
[[checks]]
column = "state"
rule = "India = rest"
by = ["page", "col"]
name = "States/UTs add up to India"

[output]
layout = "table"
rows = ["state"]
columns = "col"
format = "csv"
