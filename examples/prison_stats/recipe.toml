# pdfexorcist recipe: NCRB Prison Statistics India, Tables 1.2 and 1.3
#
# Capacity, inmate population and occupancy rate of jails by State/UT on 31st
# December. Table 1.2 splits each by sex (M, F, Tr., Total); Table 1.3 by jail
# type, a table so wide it runs over three pages by column. psi.py keys every
# value by its printed column number, (3) to (29), so the three pages join into
# one row per State/UT. Try it:
#
#   pdfexorcist extract https://www.ncrb.gov.in/uploads/files/PSI-2023.pdf --recipe examples/prison_stats/recipe.toml
#
# On the fixture (pages 58-61 of the 2023 report):
#
#   pdfexorcist extract tests/fixtures/prison_stats/psi_2023_p58-61.pdf --recipe examples/prison_stats/recipe.toml

name = "Prison Statistics India: jail capacity and occupancy"
description = "Capacity, inmates and occupancy rate by State/UT, by sex (Table 1.2) and jail type (Table 1.3)"
sample = "../../tests/fixtures/prison_stats/psi_2023_p58-61.pdf"

[pages]
match = '(?m)Table\s*[–-]\s*1\.[23]\s*(\(Con|$)'

[engines]
ocr = false  # a text layer: the five default engines, 3 must agree

[parser]
type = "custom"
function = "psi.py:parse"
key = ["page", "row", "col"]

# M + F + Tr = Total (Table 1.2); the eight jail types add up to Total (Table 1.3)
[[checks]]
column = "group"
rule = "Total = rest"
by = ["table", "row", "measure"]
where = "measure != 'occupancy'"

[[checks]]
column = "row"
rule = "totalstates = rest"
by = ["page", "col"]
where = "(section == 'state' or row == 'totalstates') and measure != 'occupancy'"

[[checks]]
column = "row"
rule = "totaluts = rest"
by = ["page", "col"]
where = "(section == 'ut' or row == 'totaluts') and measure != 'occupancy'"

[[checks]]
column = "row"
rule = "totalallindia = totalstates + totaluts"
by = ["page", "col"]
where = "measure != 'occupancy'"

# Table 1.3's Total columns repeat Table 1.2's
[[checks]]
column = "table"
rule = "1.3 = 1.2"
by = ["row", "measure"]
where = "group == 'Total'"

[[checks]]
function = "psi.py:occupancy"

[output]
layout = "table"
rows = ["state"]
columns = "column"
format = "csv"
