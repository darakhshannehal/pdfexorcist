# pdfexorcist recipe: SRS Statistical Report 2024, Table 1
#
# Percent distribution of the estimated population by age group, sex and
# residence (Office of the Registrar General of India). Each page holds one or
# two blocks, a State name over 18 age rows and a Total row of 100.0, with nine
# columns: Total, Rural and Urban, each split into Total, Males and Females.
# srs_stat.py keys cells by block and age, and keeps the State as an extra
# column. Try it on the whole report (Table 1 is on pages 222-233):
#
#   pdfexorcist extract srs_stat_2024.pdf --recipe examples/srs_statistical_report/recipe.toml
#
# On the fixture (India, Andhra Pradesh, Assam, Bihar, Chhattisgarh):
#
#   pdfexorcist extract tests/fixtures/srs_stat/srs_stat_2024_table1_p222-224.pdf --recipe examples/srs_statistical_report/recipe.toml

name = "SRS Statistical Report: age distribution"
description = "Percent distribution of population by age group, sex and residence, by State (SRS Statistical Report, Table 1)"
sample = "../../tests/fixtures/srs_stat/srs_stat_2024_table1_p222-224.pdf"

[pages]
match = 'Percent distribution of estimated population by age'

[engines]
ocr = false

[parser]
type = "custom"
function = "srs_stat.py:parse"
key = ["page", "block", "age", "col"]

# each column's 18 age groups add up to its printed 100.0, within rounding
[[checks]]
column = "age"
rule = "Total = rest"
by = ["page", "block", "col"]
abs_tolerance = 0.5
name = "age groups add up to 100"

[[checks]]
function = "srs_stat.py:total_between_parts"

[output]
layout = "table"
rows = ["state", "age"]
columns = "col"
format = "csv"
