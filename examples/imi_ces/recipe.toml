# pdfexorcist recipe: IMI Coverage Evaluation Survey 2018, Annexure A
#
# Coverage of full immunization (FIC) and each vaccine by Intensified Mission
# Indradhanush district (MoHFW/UNDP, 2018). The table is printed sideways on
# portrait pages; pdfexorcist turns those pages upright before the engines read
# them. imi_ces.py names the 11 columns, splits State from District and joins
# district names that wrap onto two lines. Try it:
#
#   pdfexorcist extract tests/fixtures/imi_ces/imi_ces_2018_annexure_p38-44.pdf --recipe examples/imi_ces/recipe.toml

name = "IMI Coverage Evaluation Survey 2018"
description = "Immunization coverage by district, Annexure A (IMI CES 2018)"
sample = "../../tests/fixtures/imi_ces/imi_ces_2018_annexure_p38-44.pdf"

[pages]
# On the whole report, only the Annexure A pages.
match = 'FIC\s*-?\s*Rural'

[engines]
ocr = false  # a text layer: the five default engines, 3 must agree

[parser]
type = "custom"
function = "imi_ces.py:parse"
key = ["page", "row", "column"]

# Drop-out BCG to MCV-1 is (BCG - MCV-1) / BCG, within rounding.
[[checks]]
function = "imi_ces.py:dropout"

[output]
layout = "table"
rows = ["state", "district"]
columns = "column"
format = "csv"
