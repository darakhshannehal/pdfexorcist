# pdfexorcist recipe: CRS State Table 6 (deaths by age group, sex and residence)
#
# A State's row (its All Ages total) is followed by one row per age group, each
# with nine values (Rural, Urban and Total, each by Male, Female and Person).
# crs_state_t6.py names each row's State and age group. Some reports print "Not
# Available" across blank cells, so values are placed by their order and by
# their position, and a cell counts only where the two agree. Try it:
#
#   pdfexorcist extract tests/fixtures/crs/crs_2023_t6_fakebold.pdf --recipe examples/crs_state_tables/table6.toml
#
# The table's number changes between reports (Table 5, 6 or 10), so [pages]
# finds it by its title.

name = "CRS State Table 6"
description = "Registered deaths by State/UT, age group, sex and residence"
sample = "../../tests/fixtures/crs/crs_2023_t6_fakebold.pdf"

[pages]
match = 'DEATHS? BY AGE AND SEX'

[engines]
ocr = false  # a text layer: the five default engines, 3 must agree

[parser]
type = "custom"
function = "crs_state_t6.py:parse"
key = ["page", "state", "age", "col"]

# ">=" because some States count Others/Not stated only in Person or Total.
[[checks]]
column = "sex"
rule = "Person >= Male + Female"
by = ["page", "state", "age", "area"]

[[checks]]
column = "area"
rule = "Total >= Rural + Urban"
by = ["page", "state", "age", "sex"]

# by State, not page: a State can run on to the next page
[[checks]]
column = "age"
rule = "All Ages = rest"
by = ["state", "col"]

[output]
layout = "table"
rows = ["page", "label", "age"]  # one row per State/UT and age group
columns = "col"                  # Rural_Male ... Total_Person
format = "csv"
